<style>
  :root {
    --bg: #fbfbf9; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e7e6e1;
    --accent: #c2410c; --chip: #f1f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --fg: #ececec; --muted: #8c8c8c; --line: #262626;
      --accent: #fb923c; --chip: #1c1c1c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 72px 20px 56px; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color .15s, color .15s; }
  a:hover { color: var(--accent); border-color: var(--accent); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  header p { color: var(--muted); margin-top: 10px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 18px; font-size: 14px; }

  section { margin-top: 52px; }
  h2 {
    font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .title { font-weight: 500; }
  .org { color: var(--muted); font-weight: 400; }
  .date { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .note { color: var(--muted); font-size: 15px; margin-top: 3px; }
  .badge { color: var(--accent); font-size: 12.5px; margin-left: 8px; font-weight: 400; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tags span { font-size: 12px; background: var(--chip); color: var(--muted); padding: 2px 8px; border-radius: 4px; }
  .compact .item { padding: 9px 0; }
  .compact .title { font-weight: 400; }

  footer { margin-top: 64px; color: var(--muted); font-size: 13px; }

  @media (max-width: 520px) {
    main { padding-top: 48px; }
    .row { flex-direction: column; gap: 0; }
    .badge { display: block; margin: 2px 0 0; }
  }
</style>

<body>
<main id="app"></main>

<script>
  const a = (text, url) => url ? `<a href="${url}"${url.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${text}</a>` : text;
  const date = d => d ? `<span class="date mono">${d}</span>` : "";
  const section = (title, items, cls = "") =>
    items && items.length ? `<section class="${cls}"><h2>${title}</h2>${items.join("")}</section>` : "";

  const experience = (SITE.experience || []).map(x => `
    <div class="item">
      <div class="row"><span class="title">${x.role} <span class="org">· ${a(x.org, x.link)}</span></span>${date(x.date)}</div>
      ${x.note ? `<p class="note">${x.note}</p>` : ""}
    </div>`);

  const projects = (SITE.projects || []).map(x => `
    <div class="item">
      <div class="row"><span class="title">${a(x.name, x.link)}${x.award ? `<span class="badge">${x.award}</span>` : ""}</span></div>
      ${x.note ? `<p class="note">${x.note}</p>` : ""}
      ${x.tags && x.tags.length ? `<div class="tags mono">${x.tags.map(t => `<span>${t}</span>`).join("")}</div>` : ""}
    </div>`);

  const achievements = (SITE.achievements || []).map(x => `
    <div class="item"><div class="row"><span class="title">${x.title}</span>${date(x.date)}</div></div>`);

  const campus = (SITE.campus || []).map(x => `
    <div class="item"><div class="row"><span class="title">${x.role} <span class="org">· ${x.org}</span></span>${date(x.date)}</div></div>`);

  const writing = (SITE.writing || []).map(x => `
    <div class="item"><div class="row"><span class="title">${a(x.title, x.link || (x.slug ? `post.html?p=${x.slug}` : ""))}</span>${date(x.date)}</div></div>`);

  document.title = SITE.name;
  document.getElementById("app").innerHTML = `
    <header>
      <h1>${SITE.name}</h1>
      <p>${SITE.about}</p>
      <nav class="links">${(SITE.links || []).map(l => a(l.label, l.url)).join("")}</nav>
    </header>
    ${section("Experience", experience)}
    ${section("Projects", projects)}
    ${section("Achievements", achievements, "compact")}
    ${section("Campus", campus, "compact")}
    ${section("Writing", writing, "compact")}
    <footer>© ${new Date().getFullYear()} ${SITE.name}</footer>
  `;
</script>
</body>
</html>
