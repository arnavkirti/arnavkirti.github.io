<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arnav Kirti</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23c2410c'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif'>A</text></svg>">
<!-- You never need to edit this file. Posts live in blog/<slug>.md -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/marked.min.js"></script>
<style>
  :root {
    --bg: #fbfbf9; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e7e6e1;
    --accent: #c2410c; --chip: #f1f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --fg: #ececec; --muted: #8c8c8c; --line: #262626;
      --accent: #fb923c; --chip: #1c1c1c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px 72px; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color .15s, color .15s; }
  a:hover { color: var(--accent); border-color: var(--accent); }
  .mono, code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .back { font-size: 14px; color: var(--muted); }
  .head { margin: 40px 0 36px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .head h1 { font-size: 28px; line-height: 1.3; font-weight: 600; letter-spacing: -0.02em; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tags span { font-size: 12px; background: var(--chip); color: var(--muted); padding: 2px 8px; border-radius: 4px; }

  article > * + * { margin-top: 1.1em; }
  article h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2em; }
  article h3 { font-size: 17px; font-weight: 600; margin-top: 1.6em; }
  article ul, article ol { padding-left: 1.3em; }
  article li + li { margin-top: .35em; }
  article a { border-color: var(--accent); }
  article code { font-size: .88em; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  article pre { background: var(--chip); padding: 14px 16px; border-radius: 6px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; }
  article pre code { background: none; padding: 0; font-size: inherit; }
  article blockquote { border-left: 2px solid var(--accent); padding-left: 14px; color: var(--muted); }
  article img { max-width: 100%; border-radius: 6px; }
  article hr { border: 0; border-top: 1px solid var(--line); }
  article table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; }
  article th, article td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; }

  footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .error { color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← Arnav Kirti</a>
  <div id="post"></div>
  <footer><a href="./">More from Arnav</a></footer>
</main>

<script>
  // Reads blog/<slug>.md. Optional header at the top of the file:
  // ---
  // title: My post
  // date: Jun 19, 2025
  // tags: Solidity, Foundry
  // ---
  const slug = new URLSearchParams(location.search).get("p") || "";
  const box = document.getElementById("post");

  function parse(text) {
    const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
    const meta = {};
    if (m) {
      m[1].split("\n").forEach(line => {
        const i = line.indexOf(":");
        if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      });
      text = text.slice(m[0].length);
    }
    return { meta, body: text };
  }

  if (!/^[a-z0-9-]+$/i.test(slug)) {
    box.innerHTML = `<p class="error" style="margin-top:40px">Post not found.</p>`;
  } else {
    fetch(`blog/${slug}.md`)
      .then(r => { if (!r.ok) throw 0; return r.text(); })
      .then(text => {
        const { meta, body } = parse(text);
        const title = meta.title || slug.replace(/-/g, " ");
        const words = body.split(/\s+/).filter(Boolean).length;
        const mins = Math.max(1, Math.round(words / 220));
        const tags = (meta.tags || "").replace(/^\[|\]$/g, "").split(",").map(t => t.trim()).filter(Boolean);
        document.title = `${title} · Arnav Kirti`;
        box.innerHTML = `
          <div class="head">
            <h1>${title}</h1>
            <div class="meta mono">${meta.date ? meta.date + " · " : ""}${mins} min read</div>
            ${tags.length ? `<div class="tags mono">${tags.map(t => `<span>${t}</span>`).join("")}</div>` : ""}
          </div>
          <article>${marked.parse(body)}</article>`;
        box.querySelectorAll('article a[href^="http"]').forEach(l => { l.target = "_blank"; l.rel = "noopener"; });
      })
      .catch(() => {
        box.innerHTML = `<p class="error" style="margin-top:40px">Post not found.</p>`;
      });
  }
</script>
</body>
</html>
